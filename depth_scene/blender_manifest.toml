schema_version = "1.0.0"

id = "depth_scene"
version = "0.3.0"
name = "Depth Scene (Marigold)"
tagline = "Image to 3D scene with Marigold depth, normals and materials"
maintainer = "saranunt-0"
type = "add-on"
website = "https://github.com/saranunt-0/2D-to-3D-TrueDepth"
tags = ["3D View", "Camera", "Mesh"]

blender_version_min = "4.2.0"

# Blender add-ons link against Blender's GPL code.
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Download depth models and install ONNX Runtime"
files = "Read images, write depth maps and models, run your own Marigold V2 install"

[build]
paths_exclude_pattern = ["__pycache__/", "/.git/", "*.zip"]
